server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # for spa routing
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","version":"${APP_VERSION}"}';
    }

    # Add-to-cart beacon (src/telemetry.ts). The cart is client-side only, so this
    # endpoint exists purely to put a line in the access log:
    #   "POST /api/events/cart?productId=<id>&quantity=<n> HTTP/1.1" 204
    # Answered locally - no upstream call.
    location = /api/events/cart {
        return 204;
    }

    location /api/orders {
        rewrite ^/api/orders$ / break;
        rewrite ^/api/orders(/.*)$ $1 break;
        proxy_pass http://order-service:3000;
        proxy_http_version 1.1;
    }

    location /api/products {
        rewrite ^/api/products$ / break;
        rewrite ^/api/products(/.*)$ $1 break;
        proxy_pass http://product-service:3002;
        proxy_http_version 1.1;
    }
}